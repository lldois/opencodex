name: Bootstrap direct-tools compatibility fix

on:
  push:
    branches:
      - fix/direct-tools-portable-schemas

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-tools-portable-schemas
          fetch-depth: 0

      - name: Apply source and regression-test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_exact_count(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacements for {old!r}, found {count}")
              p.write_text(text.replace(old, new))

          # 1) Routed models: keep hosted web-search sidecar metadata, but disable Codex deferred
          # tool_search. This makes MCP/App tools use the normal direct tool plan.
          replace_once(
              "src/codex/catalog/parsing.ts",
              '''  // Routed providers use opencodex sidecars and client-executed tool discovery. The sidecar
          // runs through native gpt-5.4-mini, so image search is available and verbalized for text-only
          // models. EXCEPT cursor: its runTurn transport bypasses the web-search plan entirely and
          // rejects server search queries — advertising the tool would make models call into a void.
          if (isCursorEntry) {
            delete entry.web_search_tool_type;
            entry.supports_search_tool = false;
          } else {
            entry.web_search_tool_type = "text_and_image";
            entry.supports_search_tool = true;
          }
          ''',
              '''  // Hosted web search and deferred client-tool discovery are separate Codex capabilities.
          // Routed providers can still use opencodex's gpt-5.4-mini web-search sidecar, but they must
          // not advertise `supports_search_tool`: that flag makes Codex hide MCP/App tools behind its
          // native `tool_search` protocol. Third-party chat/Responses models do not reliably round-trip
          // that private protocol, so expose client tools through the normal direct tool plan instead.
          if (isCursorEntry) {
            delete entry.web_search_tool_type;
          } else {
            entry.web_search_tool_type = "text_and_image";
          }
          entry.supports_search_tool = false;
          ''',
          )

          # 2) OpenAI-compatible Chat Completions through a generic gateway (e.g. NewAPI): when the
          # selected upstream model is Claude/Gemini, reuse the hardened Google/Claude schema sanitizer.
          replace_once(
              "src/adapters/openai-chat.ts",
              'import { neutralizeIdentity } from "./identity";\n',
              'import { neutralizeIdentity } from "./identity";\nimport { sanitizeGeminiToolParameters } from "./google-tool-schema";\n',
          )
          replace_once(
              "src/adapters/openai-chat.ts",
              '''  const xaiTarget = isXaiSchemaTarget(provider);
          const kimiTarget = isKimiSchemaTarget(provider);
          const formatted = tools.flatMap(t => {
            const parameters = xaiTarget
              ? normalizeXaiToolParameters(t.parameters)
              : kimiTarget
                ? ensureKimiRootObjectType(t.parameters)
                : t.parameters;
          ''',
              '''  const xaiTarget = isXaiSchemaTarget(provider);
          const kimiTarget = isKimiSchemaTarget(provider);
          // Generic OpenAI-compatible gateways such as NewAPI can route a Chat Completions request
          // to Gemini/Claude. Their downstream function-schema converters reject Codex/MCP JSON Schema
          // features such as local $ref/$defs. Detect the selected model, not the gateway hostname.
          const googleBridgeTarget = /(?:^|[/_.:-])(?:claude|gemini)(?:$|[/_.:-])/i.test(parsed.modelId);
          const formatted = tools.flatMap(t => {
            const parameters = xaiTarget
              ? normalizeXaiToolParameters(t.parameters)
              : kimiTarget
                ? ensureKimiRootObjectType(t.parameters)
                : googleBridgeTarget
                  ? sanitizeGeminiToolParameters(t.parameters)
                  : t.parameters;
          ''',
          )

          # 3) Same compatibility path for generic Responses passthrough. Recurse through Codex
          # namespace/additional_tools containers, while leaving DeepSeek/other models unchanged.
          replace_once(
              "src/adapters/openai-responses.ts",
              'import type { TranslatorBudget } from "../lib/translator-budget";\n',
              'import type { TranslatorBudget } from "../lib/translator-budget";\nimport { sanitizeGeminiToolParameters } from "./google-tool-schema";\n',
          )
          replace_once(
              "src/adapters/openai-responses.ts",
              '''function normalizeFunctionToolSchema(tool: unknown): unknown {
          if (!isPlainObject(tool) || tool.type !== "function") return tool;
          if (isPlainObject(tool.parameters) && tool.parameters.type === "object") return tool;
          return {
            ...tool,
            parameters: { ...(isPlainObject(tool.parameters) ? tool.parameters : {}), type: "object" },
          };
          }

          function normalizeToolSchemas(body: unknown): unknown {
          if (!isPlainObject(body)) return body;

          const normalizeTools = (tools: unknown[]): unknown[] => {
            let changed = false;
            const normalized = tools.map((tool) => {
              const fixed = normalizeFunctionToolSchema(tool);
              if (fixed !== tool) changed = true;
              return fixed;
            });
            return changed ? normalized : tools;
          };

          let normalizedBody = body;
          if (Array.isArray(body.tools)) {
            const tools = normalizeTools(body.tools);
            if (tools !== body.tools) normalizedBody = { ...normalizedBody, tools };
          }
          if (Array.isArray(normalizedBody.input)) {
            let inputChanged = false;
            const input = normalizedBody.input.map((item) => {
              if (!isPlainObject(item) || item.type !== "additional_tools" || !Array.isArray(item.tools)) return item;
              const tools = normalizeTools(item.tools);
              if (tools === item.tools) return item;
              inputChanged = true;
              return { ...item, tools };
            });
            if (inputChanged) normalizedBody = { ...normalizedBody, input };
          }
          return normalizedBody;
          }
          ''',
              '''function shouldSanitizeGoogleBridgeSchemas(modelId: string): boolean {
          return /(?:^|[/_.:-])(?:claude|gemini)(?:$|[/_.:-])/i.test(modelId);
          }

          function normalizeFunctionToolSchema(tool: unknown, googleBridgeTarget: boolean): unknown {
          if (!isPlainObject(tool) || tool.type !== "function") return tool;
          const normalizedParameters = isPlainObject(tool.parameters) && tool.parameters.type === "object"
            ? tool.parameters
            : { ...(isPlainObject(tool.parameters) ? tool.parameters : {}), type: "object" };
          const parameters = googleBridgeTarget
            ? sanitizeGeminiToolParameters(normalizedParameters)
            : normalizedParameters;
          if (parameters === tool.parameters) return tool;
          return { ...tool, parameters };
          }

          function normalizeToolSchemas(body: unknown, modelId: string): unknown {
          if (!isPlainObject(body)) return body;
          const googleBridgeTarget = shouldSanitizeGoogleBridgeSchemas(modelId);

          function normalizeTool(tool: unknown): unknown {
            const fixed = normalizeFunctionToolSchema(tool, googleBridgeTarget);
            if (fixed !== tool) return fixed;
            if (!isPlainObject(tool) || tool.type !== "namespace" || !Array.isArray(tool.tools)) return tool;
            const tools = normalizeTools(tool.tools);
            return tools === tool.tools ? tool : { ...tool, tools };
          }

          function normalizeTools(tools: unknown[]): unknown[] {
            let changed = false;
            const normalized = tools.map((tool) => {
              const fixed = normalizeTool(tool);
              if (fixed !== tool) changed = true;
              return fixed;
            });
            return changed ? normalized : tools;
          }

          let normalizedBody = body;
          if (Array.isArray(body.tools)) {
            const tools = normalizeTools(body.tools);
            if (tools !== body.tools) normalizedBody = { ...normalizedBody, tools };
          }
          if (Array.isArray(normalizedBody.input)) {
            let inputChanged = false;
            const input = normalizedBody.input.map((item) => {
              if (!isPlainObject(item) || item.type !== "additional_tools" || !Array.isArray(item.tools)) return item;
              const tools = normalizeTools(item.tools);
              if (tools === item.tools) return item;
              inputChanged = true;
              return { ...item, tools };
            });
            if (inputChanged) normalizedBody = { ...normalizedBody, input };
          }
          return normalizedBody;
          }
          ''',
          )
          replace_once(
              "src/adapters/openai-responses.ts",
              'const sanitizedBody = normalizeToolSchemas(stripSparkCompatibility(stripUnsupportedReasoningParams(stripItemIdsWhenUnstored(stripInvalidItemIds(stripUnsupportedHostedTools(sanitizeReasoningInputContent(scrubOcxCompactionItems(outBody))))))));',
              'const sanitizedBody = normalizeToolSchemas(stripSparkCompatibility(stripUnsupportedReasoningParams(stripItemIdsWhenUnstored(stripInvalidItemIds(stripUnsupportedHostedTools(sanitizeReasoningInputContent(scrubOcxCompactionItems(outBody)))))))), parsed.modelId);',
          )

          # 4) Update existing catalog regression expectations. Native OpenAI rows intentionally keep true.
          replace_once(
              "tests/catalog-cursor-search.test.ts",
              '''  test("non-cursor routed entries keep the sidecar-backed search advertisement", () => {
            const entry = normalizeRoutedCatalogEntry({ slug: "opencode-go/glm-5.2" } as never) as Record<string, unknown>;
            expect(entry.supports_search_tool).toBe(true);
            expect(entry.web_search_tool_type).toBe("text_and_image");
            expect(entry.supports_parallel_tool_calls).toBe(false);
          });
          ''',
              '''  test("non-cursor routed entries keep sidecar web search but expose client tools directly", () => {
            const entry = normalizeRoutedCatalogEntry({ slug: "opencode-go/glm-5.2" } as never) as Record<string, unknown>;
            expect(entry.supports_search_tool).toBe(false);
            expect(entry.web_search_tool_type).toBe("text_and_image");
            expect(entry.supports_parallel_tool_calls).toBe(false);
          });
          ''',
          )
          replace_once(
              "tests/e2e-style/phase100-native-parity.test.ts",
              '''    expect(routed).toMatchObject({
                web_search_tool_type: "text_and_image",
                supports_search_tool: true,
          ''',
              '''    expect(routed).toMatchObject({
                web_search_tool_type: "text_and_image",
                supports_search_tool: false,
          ''',
          )
          replace_exact_count(
              "tests/codex-catalog.test.ts",
              'expect(row.supports_search_tool).toBe(true);',
              'expect(row.supports_search_tool).toBe(false);',
              1,
          )
          replace_exact_count(
              "tests/codex-catalog.test.ts",
              'expect(entry.supports_search_tool).toBe(true);',
              'expect(entry.supports_search_tool).toBe(false);',
              1,
          )
          replace_exact_count(
              "tests/codex-catalog.test.ts",
              'expect(routed?.supports_search_tool).toBe(true);',
              'expect(routed?.supports_search_tool).toBe(false);',
              2,
          )

          # 5) End-to-end adapter-level regression for the exact NewAPI failure mode: Gmail-style
          # local refs must be flattened for Claude/Gemini on both OpenAI-compatible wires, while
          # DeepSeek keeps its full schema untouched.
          Path("tests/newapi-tool-schema-compat.test.ts").write_text(r'''import { describe, expect, test } from "bun:test";
          import { createOpenAIChatAdapter } from "../src/adapters/openai-chat";
          import { createResponsesPassthroughAdapter } from "../src/adapters/openai-responses";
          import { createTranslatorBudget } from "../src/lib/translator-budget";
          import type { OcxParsedRequest, OcxProviderConfig, OcxTool } from "../src/types";

          function gmailParameters(): Record<string, unknown> {
            return {
              type: "object",
              properties: {
                part: { $ref: "#/$defs/GmailMessagePartRequest" },
                mode: { anyOf: [{ type: "string", enum: ["full"] }, { type: "null" }] },
              },
              required: ["part"],
              $defs: {
                GmailMessagePartRequest: {
                  type: "object",
                  properties: {
                    mimeType: { type: "string" },
                    body: { type: "string", "x-mcp-header": "X-Gmail-Part" },
                  },
                  required: ["mimeType"],
                },
              },
            };
          }

          function parsedChat(modelId: string): OcxParsedRequest {
            return {
              modelId,
              stream: false,
              options: {},
              context: {
                messages: [{ role: "user", content: "inspect gmail", timestamp: 0 }],
                tools: [{ name: "gmail_read", description: "Read Gmail", parameters: gmailParameters() } as OcxTool],
              },
            } as OcxParsedRequest;
          }

          function assertPortable(parameters: Record<string, unknown>): void {
            expect(parameters.$defs).toBeUndefined();
            expect(parameters.definitions).toBeUndefined();
            expect(JSON.stringify(parameters)).not.toContain('"$ref"');
            const properties = parameters.properties as Record<string, Record<string, unknown>>;
            expect(properties.part.type).toBe("object");
            expect((properties.part.properties as Record<string, Record<string, unknown>>).mimeType.type).toBe("string");
            expect(JSON.stringify(properties.part)).not.toContain("x-mcp-header");
            expect(properties.mode).toEqual({ type: "string", enum: ["full"], nullable: true });
          }

          const chatProvider = {
            adapter: "openai-chat",
            baseUrl: "https://newapi.example/v1",
            authMode: "key",
            apiKey: "sk-test",
          } as OcxProviderConfig;

          const responsesProvider = {
            adapter: "openai-responses",
            baseUrl: "https://newapi.example/v1",
            authMode: "key",
            apiKey: "sk-test",
          } as OcxProviderConfig;

          describe("NewAPI-style Claude/Gemini tool schema compatibility", () => {
            test("Chat Completions sanitizes Gmail $ref/$defs for Claude and Gemini", () => {
              for (const modelId of ["claude-opus-4-6-thinking", "vendor/gemini-3.6-pro"]) {
                const request = createOpenAIChatAdapter(chatProvider).buildRequest(parsedChat(modelId));
                const body = JSON.parse(String(request.body)) as {
                  tools: Array<{ function: { parameters: Record<string, unknown> } }>;
                };
                assertPortable(body.tools[0].function.parameters);
              }
            });

            test("Chat Completions leaves DeepSeek JSON Schema intact", () => {
              const request = createOpenAIChatAdapter(chatProvider).buildRequest(parsedChat("deepseek-v4-flash"));
              const body = JSON.parse(String(request.body)) as {
                tools: Array<{ function: { parameters: Record<string, unknown> } }>;
              };
              expect(body.tools[0].function.parameters.$defs).toBeDefined();
              expect(JSON.stringify(body.tools[0].function.parameters)).toContain('"$ref"');
            });

            test("Responses passthrough sanitizes top-level, namespace, and additional_tools schemas", () => {
              const budget = createTranslatorBudget();
              try {
                const schema = gmailParameters();
                const request = createResponsesPassthroughAdapter(responsesProvider).buildRequest({
                  modelId: "newapi/gemini-3.6-pro",
                  stream: true,
                  options: {},
                  context: { messages: [] },
                  _rawBody: {
                    model: "gemini-3.6-pro",
                    input: [{
                      type: "additional_tools",
                      tools: [{ type: "function", name: "gmail_additional", parameters: schema }],
                    }],
                    tools: [
                      { type: "function", name: "gmail_top", parameters: schema },
                      {
                        type: "namespace",
                        name: "gmail",
                        tools: [{ type: "function", name: "nested", parameters: schema }],
                      },
                    ],
                  },
                } as OcxParsedRequest, { headers: new Headers(), translatorBudget: budget });
                const body = JSON.parse(String(request.body)) as {
                  tools: Array<Record<string, unknown>>;
                  input: Array<{ tools: Array<Record<string, unknown>> }>;
                };
                assertPortable((body.tools[0] as { parameters: Record<string, unknown> }).parameters);
                const namespace = body.tools[1] as { tools: Array<{ parameters: Record<string, unknown> }> };
                assertPortable(namespace.tools[0].parameters);
                assertPortable((body.input[0].tools[0] as { parameters: Record<string, unknown> }).parameters);
                request.releaseBodyObservation?.();
              } finally {
                budget.dispose();
              }
            });

            test("Responses passthrough leaves DeepSeek JSON Schema intact", () => {
              const budget = createTranslatorBudget();
              try {
                const request = createResponsesPassthroughAdapter(responsesProvider).buildRequest({
                  modelId: "deepseek-v4-flash",
                  stream: true,
                  options: {},
                  context: { messages: [] },
                  _rawBody: {
                    model: "deepseek-v4-flash",
                    input: [],
                    tools: [{ type: "function", name: "gmail_read", parameters: gmailParameters() }],
                  },
                } as OcxParsedRequest, { headers: new Headers(), translatorBudget: budget });
                const body = JSON.parse(String(request.body)) as {
                  tools: Array<{ parameters: Record<string, unknown> }>;
                };
                expect(body.tools[0].parameters.$defs).toBeDefined();
                expect(JSON.stringify(body.tools[0].parameters)).toContain('"$ref"');
                request.releaseBodyObservation?.();
              } finally {
                budget.dispose();
              }
            });
          });
          '''.replace("          ", ""))

          # The bootstrap workflow is only a transport for applying the patch through GitHub's own
          # runner; remove it from the resulting source commit.
          Path(".github/workflows/bootstrap-direct-tools-fix.yml").unlink()
          PY

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: expose routed tools directly and sanitize Claude/Gemini schemas"
          git push origin HEAD:fix/direct-tools-portable-schemas
