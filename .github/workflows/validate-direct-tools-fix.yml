# Temporary validation workflow; removed before merge.
name: Validate direct-tools fix

on:
  push:
    branches:
      - fix/direct-tools-portable-schemas

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-tools-portable-schemas
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Run direct-tool and schema compatibility regressions
        run: >-
          bun test --isolate
          tests/newapi-tool-schema-compat.test.ts
          tests/catalog-cursor-search.test.ts
          tests/codex-catalog.test.ts
          tests/e2e-style/phase100-native-parity.test.ts
          tests/openai-responses-passthrough.test.ts

  windows-full-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-tools-portable-schemas
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Full core tests
        run: bun test --isolate tests
      - name: GUI tests
        run: cd gui && bun test tests
      - name: Privacy scan
        run: bun run privacy:scan
      - name: GUI lint
        run: cd gui && bun run lint
      - name: GUI build
        run: cd gui && bun run build
      - name: CLI help smoke
        run: bun run src/cli/index.ts help

  npm-global-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-tools-portable-schemas
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package dependencies
        run: npm install
      - name: Build package assets
        run: npm run build:gui
      - name: Pack
        shell: bash
        run: npm pack --json > pack.json
      - name: Verify packed GUI asset
        run: node -e "const p=require('./pack.json')[0]; if (!p.files.some(f => f.path === 'gui/dist/index.html')) { console.error('missing gui/dist/index.html in npm pack'); process.exit(1); }"
      - name: Install globally
        shell: bash
        run: npm install -g ./bitkyc08-opencodex-*.tgz
      - name: CLI help smoke
        run: ocx help
