name: Fix Responses sanitizer syntax

on:
  push:
    branches:
      - fix/direct-tools-portable-schemas

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-tools-portable-schemas
      - name: Fix and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/adapters/openai-responses.ts')
          text = p.read_text()
          old = 'const sanitizedBody = normalizeToolSchemas(stripSparkCompatibility(stripUnsupportedReasoningParams(stripItemIdsWhenUnstored(stripInvalidItemIds(stripUnsupportedHostedTools(sanitizeReasoningInputContent(scrubOcxCompactionItems(outBody)))))))), parsed.modelId);'
          new = 'const sanitizedBody = normalizeToolSchemas(stripSparkCompatibility(stripUnsupportedReasoningParams(stripItemIdsWhenUnstored(stripInvalidItemIds(stripUnsupportedHostedTools(sanitizeReasoningInputContent(scrubOcxCompactionItems(outBody))))))), parsed.modelId);'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-ci-syntax.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: correct Responses sanitizer call nesting"
          git push origin HEAD:fix/direct-tools-portable-schemas
